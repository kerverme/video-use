[project]
name = "cloud-video-studio"
version = "0.1.0"
description = "CLOUD VIDEO — private web workspace that drives the video-use editing engine"
requires-python = ">=3.10"
dependencies = [
    # video-use (the repo root) — pulls in its own helper deps (numpy, pillow, requests, ...)
    "video-use",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.70",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.uv.sources]
video-use = { path = "..", editable = true }
